name: NPC State v0.2.21 hard pass

on:
  push:
    branches: [fix/v0.2.21-deep-pass]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hard-pass:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply candidate patch
        run: |
          if grep -q '"version": "0.2.21"' manifest.json; then
            echo 'Base v0.2.21 candidate already present.'
          else
            python3 .release/v021_patch.py
            python3 .release/v021_postfix.py
            python3 .release/v021_manualfix.py
            python3 .release/v021_fixturefix.py
            python3 .release/v021_partialretry.py
          fi
          python3 .release/v021_finalreview.py
          python3 .release/v021_finalreview_post.py
      - name: Ten consecutive hard passes
        run: |
          set -euo pipefail
          for pass in $(seq 1 10); do
            echo "===== HARD PASS ${pass}/10 ====="
            node --check bootstrap.js
            node --check hardening.js
            node --check hardening-core.js
            node --check index.js
            node --check core.js
            node --check core-v0218.js
            node --check branch.js
            node --check branch-v0218.js
            node --check bundle.js
            node --check social.js
            node --check storage.js
            node --check identity.js
            node --check tests/hardening-v0219.test.js
            node --check tests/hardening-v0220.test.js
            node --check tests/hardening-v0221.test.js
            git diff --check
            npm test
          done
      - name: Release invariants
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const core = fs.readFileSync('core.js', 'utf8');
          const index = fs.readFileSync('index.js', 'utf8');
          const hardening = fs.readFileSync('hardening.js', 'utf8');
          const storage = fs.readFileSync('storage.js', 'utf8');
          if (manifest.version !== '0.2.21') throw new Error('manifest version mismatch');
          if (!core.includes("NPC_STATE_VERSION = '0.2.21'")) throw new Error('core version mismatch');
          if (!index.includes('simple: true')) throw new Error('host deletion probe is not simple');
          if (!index.includes('resolveDeletedLifecycleKeyFromPresence')) throw new Error('owner-safe delete resolver missing');
          if (!index.includes('runBoundedLifecycleEvent')) throw new Error('bounded engine lifecycle missing');
          if (!index.includes('destinationRepresentations = [destinationState, destinationCache, destinationInline]')) throw new Error('rename destination convergence guard missing');
          if (!hardening.includes('runBoundedHardeningEvent')) throw new Error('bounded hardening lifecycle missing');
          if (!hardening.includes('HISTORICAL_RENAME_CANDIDATE_LIMIT = 1024')) throw new Error('historical rename batch bound missing');
          if (!storage.includes('continuousRetry = true')) throw new Error('bounded lifecycle write mode missing');
          if (!storage.includes('withLocalStorageWriterLock')) throw new Error('cross-tab fallback lock missing');
          if (!index.includes('NPC_STATE_OWNER_FLUSH_INCOMPLETE')) throw new Error('owner flush fail-closed guard missing');
          if (!hardening.includes('NPC_STATE_OWNER_RENAME_PARTIAL') || !hardening.includes('NPC_STATE_OWNER_DELETE_PARTIAL')) throw new Error('partial owner retry guards missing');
          if (!fs.existsSync('tests/hardening-v0221.test.js')) throw new Error('v0.2.21 regressions missing');
          NODE
      - name: Commit verified candidate
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'kohz87'
          git config user.email '83744063+kohz87@users.noreply.github.com'
          git add CHANGELOG.md CODE-REVIEW.md README.md TEST-REPORT.md bootstrap.js core.js hardening-core.js hardening.js index.js manifest.json storage.js tests/hardening-v0220.test.js tests/hardening-v0221.test.js tests/runtime-smoke.mjs tests/migration-smoke.mjs tests/package.test.js tests/compatibility-check.js tests/v0214-hardening.test.js tests/v0217-hardening.test.js
          git diff --cached --check
          git commit -m 'release-candidate: v0.2.21 final adversarial hardening'
          git push origin HEAD:fix/v0.2.21-deep-pass
