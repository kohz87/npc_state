name: NPC State v0.2.20 Final Fix Gate

on:
  push:
    branches: [fix/v0.2.20-hard-pass]

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply final patch
        run: |
          python3 -m py_compile tests/v0220-final-patch.py
          python3 tests/v0220-final-patch.py
      - name: Ten exact-tree hard passes
        run: |
          set -euo pipefail
          for pass in $(seq 1 10); do
            echo "===== HARD PASS ${pass}/10 ====="
            node --check bootstrap.js
            node --check hardening.js
            node --check hardening-core.js
            node --check index.js
            node --check core.js
            node --check core-v0218.js
            node --check branch.js
            node --check branch-v0218.js
            node --check bundle.js
            node --check social.js
            node --check storage.js
            node --check identity.js
            node --check tests/hardening-v0219.test.js
            node --check tests/hardening-v0220.test.js
            node --check tests/runtime-smoke.mjs
            node --check tests/migration-smoke.mjs
            git diff --check
            npm test
            node --input-type=module -e "import fs from 'node:fs'; const m=JSON.parse(fs.readFileSync('manifest.json','utf8')); const c=fs.readFileSync('core.js','utf8'); const r=fs.readFileSync('README.md','utf8'); const b=fs.readFileSync('bootstrap.js','utf8'); if(m.version!=='0.2.20') throw new Error('version'); if(!c.includes(\"NPC_STATE_VERSION = '0.2.20'\")) throw new Error('core'); if(!r.startsWith('# NPC State v0.2.20')) throw new Error('readme'); if(m.js!=='bootstrap.js') throw new Error('bootstrap'); if(b.indexOf('await prepareNpcStateHardening()')<0 || b.indexOf(\"await import('./index.js')\")<0 || b.indexOf('await prepareNpcStateHardening()')>b.indexOf(\"await import('./index.js')\")) throw new Error('order');"
          done
      - name: Commit verified source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js hardening.js storage.js tests/runtime-smoke.mjs tests/hardening-v0220.test.js CHANGELOG.md CODE-REVIEW.md TEST-REPORT.md
          git diff --cached --check
          git commit -m "fix: close final v0.2.20 lifecycle edge cases"
          git push origin HEAD:fix/v0.2.20-hard-pass
