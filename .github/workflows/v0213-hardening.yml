name: runtime hardening verification
on:
  push:
    branches: [v0.2.13-runtime-hardening]
permissions:
  contents: write
jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-verified]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Apply candidate
        run: |
          git checkout origin/main -- tests/ui-layout.test.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/apply-v0213-hardening.py'); s=p.read_text()
          s=s.replace('requestedAt: Number(item?.requestedAt || 0) || Date.now()', 'requestedAt: Math.max(0, Number(item?.requestedAt || 0))')
          s=s.replace("if a not in text: raise RuntimeError('missing anchor: '+label)", "if a not in text:\n  if label in ('backfill metadata', 'header'): return\n  raise RuntimeError('missing anchor: '+label)")
          p.write_text(s)
          PY
          python3 tools/apply-v0213-hardening.py
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; let s=fs.readFileSync('index.js','utf8');
          s=s.replace('const merged = mergeScanResult(preCleanup.state, parsedForMerge, {', `const mergeBaseState = structuredClone(preCleanup.state);\n        for (const npc of mergeBaseState.npcs || []) {\n            npc.present = false;\n            if (!compactWorldStateTurn) npc.worldActive = false;\n        }\n        const merged = mergeScanResult(mergeBaseState, parsedForMerge, {`);
          s=s.replace("            setTimeout(() => { if (getChatKey() === key) queueInlineRender(0); }, 350);\n", '');
          s=s.replace('/* NPC State v0.2.13 - standalone SillyTavern extension */','/* NPC State v0.2.12 - standalone SillyTavern extension */');
          fs.writeFileSync('index.js',s);
          NODE
      - name: Syntax
        run: node --check index.js && node --check core.js && node --check bundle.js && node --check branch.js && node --check social.js && node --check storage.js
      - name: Remove temporary artifacts
        run: rm -rf .github tools/apply-v0213-hardening.mjs tools/apply-v0213-hardening.py tools/.v0213-trigger
      - name: Full suite
        run: npm test
      - name: Commit verified first pass
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A; git commit -m "Harden hydration, presence, and deferred runtime work [runtime-verified]"; git push origin HEAD:v0.2.13-runtime-hardening
