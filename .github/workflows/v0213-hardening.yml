name: v0.2.13 runtime hardening
on:
  push:
    branches: [v0.2.13-runtime-hardening]
permissions:
  contents: write
jobs:
  harden-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[v0213-verified]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply runtime hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('tools/apply-v0213-hardening.py')
          s=p.read_text()
          s=re.sub(r"r\(\"        requestedAt:.*?'backfill metadata'\)\n", "", s, count=1, flags=re.S)
          p.write_text(s)
          PY
          python3 tools/apply-v0213-hardening.py
      - name: Advance release metadata
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const file of ['core.js', 'manifest.json', 'package.json']) {
            if (!fs.existsSync(file)) continue;
            let text = fs.readFileSync(file, 'utf8');
            text = text.replaceAll('0.2.12', '0.2.13');
            if (file === 'manifest.json') text = text.replace('"author": "Deployment test build"', '"author": "kohz87"');
            fs.writeFileSync(file, text);
          }
          NODE
      - name: Syntax check
        run: |
          node --check index.js
          node --check core.js
          node --check bundle.js
          node --check branch.js
          node --check social.js
          node --check storage.js
      - name: Full repository test suite
        run: npm test
      - name: Remove temporary helpers
        run: rm -f tools/apply-v0213-hardening.mjs tools/apply-v0213-hardening.py tools/.v0213-trigger
      - name: Commit verified first pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.2.13: harden hydration and deferred runtime work [v0213-verified]"
          git push origin HEAD:v0.2.13-runtime-hardening
