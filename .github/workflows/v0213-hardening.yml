name: v0.2.13 runtime hardening
on:
  push:
    branches: [v0.2.13-runtime-hardening]
permissions:
  contents: write
jobs:
  harden-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[v0213-verified]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Show exact failing source window
        run: nl -ba tests/runtime-smoke.mjs | sed -n '500,515p'; exit 1
