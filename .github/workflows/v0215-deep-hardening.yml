name: v0.2.15 Deep Hardening 10x
on:
  workflow_dispatch:
  push:
    branches: [v0.2.15-deep-hardening-10x]
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply audited fixes
        run: python3 .github/scripts/apply_v0215_hardening.py
      - name: Ten hard review passes
        run: |
          set -uo pipefail
          : > /tmp/hardening.log
          status=0
          for pass in $(seq 1 10); do
            echo "===== HARD PASS ${pass}/10 =====" | tee -a /tmp/hardening.log
            for cmd in "node --check index.js" "node --check core.js" "node --check branch.js" "node --check bundle.js" "node --check social.js" "node --check storage.js" "npm test" "node tests/compatibility-check.js"; do
              echo "> $cmd" >> /tmp/hardening.log
              bash -lc "$cmd" >> /tmp/hardening.log 2>&1 || { status=$?; break 2; }
            done
            for invariant in \
              "function persist(key = getChatKey())" \
              "pending.fingerprint !== currentFingerprint" \
              "pending.lineageKey !== currentLineageKey" \
              "startup hydration failed; extension remains mounted in read-only recovery mode" \
              "retains the predecessor sidecar as a recovery copy"; do
              grep -Fq "$invariant" index.js || { echo "MISSING INVARIANT: $invariant" >> /tmp/hardening.log; status=91; break 2; }
            done
            grep -Fq "if (prefixLength < 2) continue" branch.js || { echo "MISSING ANCESTOR THRESHOLD" >> /tmp/hardening.log; status=92; break; }
            echo "PASS ${pass}/10 GREEN" | tee -a /tmp/hardening.log
          done
          if [ "$status" -ne 0 ]; then
            cp /tmp/hardening.log .github/HARDENING_FAILURE.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/HARDENING_FAILURE.txt
            git commit -m "diagnostic: capture v0.2.15 hardening failure [skip ci]" || true
            git push origin HEAD:v0.2.15-deep-hardening-10x || true
            exit "$status"
          fi
      - name: Commit verified production files to staging
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js branch.js tests/v0215-hardening.test.js
          if git diff --cached --quiet; then
            echo "No production changes to commit"
          else
            git commit -m "Deep harden v0.2.15 branch identity and durability [10x verified]"
            git push origin HEAD:v0.2.15-deep-hardening-10x
          fi
