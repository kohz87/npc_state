name: v0.2.15 Deep Hardening 10x
on:
  workflow_dispatch:
  push:
    branches: [v0.2.15-deep-hardening-10x]
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply audited fixes and review corrections
        run: |
          python3 .github/scripts/apply_v0215_hardening.py
          python3 .github/scripts/review_fix_v0215.py
      - name: Ten hard review passes
        run: |
          set -uo pipefail
          status=0
          for pass in $(seq 1 10); do
            echo "===== HARD PASS ${pass}/10 ====="
            for cmd in "node --check index.js" "node --check core.js" "node --check branch.js" "node --check bundle.js" "node --check social.js" "node --check storage.js" "npm test" "node tests/compatibility-check.js"; do
              bash -lc "$cmd" >/tmp/pass.log 2>&1 || { cat /tmp/pass.log; status=$?; break 2; }
            done
            for invariant in \
              "function persist(key = getChatKey())" \
              "pending.fingerprint !== currentFingerprint" \
              "pending.lineageKey !== currentLineageKey" \
              "startup hydration failed; extension remains mounted in read-only recovery mode" \
              "retains the predecessor sidecar as a recovery copy"; do
              grep -Fq "$invariant" index.js || { status=91; break 2; }
            done
            grep -Fq "if (prefixLength < 1) continue" branch.js || { status=92; break; }
            grep -Fq "sharedPrefix.some(message => message?.is_user)" branch.js || { status=93; break; }
            echo "PASS ${pass}/10 GREEN"
          done
          exit "$status"
      - name: Commit verified production files to staging
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js branch.js tests/v0215-hardening.test.js tests/index-hardening.test.js tests/quality.test.js
          if git diff --cached --quiet; then
            echo "No production changes to commit"
          else
            git commit -m "Deep harden v0.2.15 branch identity and durability [10x verified]"
            git push origin HEAD:v0.2.15-deep-hardening-10x
          fi
