name: Hardening Apply

on:
  push:
    branches:
      - hardening-identity-import-safety

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize source for reviewed patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.js')
          s = p.read_text()
          s = s.replace('    removeStructuredReferencesForNpc,\n', '')
          p.write_text(s)
          PY
      - name: Apply reviewed hardening patch
        run: |
          python3 tools/apply-hardening.py
          python3 tools/apply-remaining-hardening-tests.py
      - name: Restore structured-reference import if needed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.js')
          s = p.read_text()
          if 'removeStructuredReferencesForNpc(' in s and '    removeStructuredReferencesForNpc,\n' not in s:
              needle = '    reconcileNpcSocialGraph,\n'
              if needle not in s:
                  raise SystemExit('Unable to restore removeStructuredReferencesForNpc import')
              s = s.replace(needle, '    removeStructuredReferencesForNpc,\n' + needle, 1)
              p.write_text(s)
          PY
      - name: Syntax check
        run: |
          node --check index.js
          node --check branch.js
          node --check bundle.js
      - name: Full repository test suite
        run: npm test
      - name: Remove temporary patch helpers and workflow
        run: |
          rm -f tools/apply-hardening.py tools/apply-remaining-hardening-tests.py .github/workflows/hardening-apply.yml trigger-hardening
      - name: Commit verified hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Harden NPC identity, imports, branches, and scan concurrency"
          git push origin HEAD:hardening-identity-import-safety