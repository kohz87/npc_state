name: Hardening Apply

on:
  push:
    branches:
      - hardening-identity-import-safety

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed hardening patch
        run: |
          python3 tools/apply-hardening.py
          python3 tools/apply-remaining-hardening-tests.py
      - name: Align legacy regression assertions with ID tombstones
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tests/branch.test.js')
          s = p.read_text()
          old = """    assert.ok(restored.state.dismissed.includes('brina hael'));\n\n    const cleared = clearUserDismissedGroupsFor(restored.state.userDismissedGroups, 'Brina');\n    assert.equal(cleared.groups.length, 0);\n    assert.ok(cleared.removedLabels.includes('brina hael'));\n    assert.ok(cleared.removedLabels.includes('the innkeeper'));\n"""
          new = """    assert.ok(!restored.state.dismissed.includes('brina hael'), 'modern ID tombstones must not globally suppress future homonyms by label');\n\n    const cleared = clearUserDismissedGroupsFor(restored.state.userDismissedGroups, brina, { modernByIdOnly: true });\n    assert.equal(cleared.groups.length, 0);\n    assert.ok(cleared.removedLabels.includes('brina hael'));\n    assert.ok(cleared.removedLabels.includes('the innkeeper'));\n"""
          if old not in s:
              raise SystemExit('branch legacy assertion block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/ui-layout.test.js')
          s = p.read_text()
          old = "    assert.match(index, /suppresses automatic rediscovery/);\n"
          if old not in s:
              raise SystemExit('ui legacy deletion wording assertion not found')
          p.write_text(s.replace(old, '', 1))

          p = Path('tests/runtime-smoke.mjs')
          s = p.read_text()
          old = "    assert.ok(state.dismissed.includes('wiz'), 'settings delete should suppress immediate scanner rediscovery');\n"
          new = """    assert.ok(state.userDismissedGroups.some(group => group.ids?.includes(wizIdForDelete)), 'settings delete should suppress immediate scanner rediscovery by stable ID');\n    assert.ok(!state.dismissed.includes('wiz'), 'modern ID tombstones must not globally suppress future same-name NPCs');\n"""
          if old not in s:
              raise SystemExit('runtime legacy deletion assertion not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Syntax check
        run: |
          node --check index.js
          node --check branch.js
          node --check bundle.js
      - name: Full repository test suite
        run: |
          npm test > /tmp/npc-state-test.log 2>&1 || {
            grep -A 24 -B 6 '^not ok' /tmp/npc-state-test.log || true
            tail -n 40 /tmp/npc-state-test.log
            exit 1
          }
          tail -n 25 /tmp/npc-state-test.log
      - name: Remove temporary patch helpers and workflow
        run: |
          rm -f tools/apply-hardening.py tools/apply-remaining-hardening-tests.py .github/workflows/hardening-apply.yml trigger-hardening
      - name: Commit verified hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Harden NPC identity, imports, branches, and scan concurrency"
          git push origin HEAD:hardening-identity-import-safety