name: Apply v0.3.2 branch recovery

on:
  push:
    branches: [v0.3.2-branch-rebase-recovery]
    paths:
      - tools/apply-v032-branch-rebase.py
      - .github/workflows/v032-apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v0.3.2-branch-rebase-recovery
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply patch
        run: python tools/apply-v032-branch-rebase.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md manifest.json bootstrap.js v03 tests
          git diff --cached --check
          git commit -m "feat: add recoverable branch rebase for v0.3.2"
          git push origin HEAD:v0.3.2-branch-rebase-recovery
