name: runtime hardening pass 2
on:
  push:
    branches: [v0.2.13-runtime-hardening]
permissions:
  contents: write
jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[pass2-verified]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Apply second-pass fixes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; let s=fs.readFileSync('index.js','utf8');
          const b="    for (const prefix of ['chat:', 'group:']) {\n        const oldKey = `${prefix}${oldId}`;";
          if(!s.includes(b)) throw new Error('rename namespace anchor missing');
          s=s.replace(b,"    const currentPrefix = getChatKey().startsWith('group:') ? 'group:' : 'chat:';\n    for (const prefix of [currentPrefix]) {\n        const oldKey = `${prefix}${oldId}`;");
          const c="    if (changed) persistSettings();\n    return changed;\n}\n\nfunction cleanMessage";
          if(!s.includes(c)) throw new Error('rename completion anchor missing');
          s=s.replace(c,"    if (changed) persistSettings();\n    return changed;\n}\n\nfunction flushCurrentChatOnPageHide() {\n    const key = getChatKey();\n    if (key === 'no-chat' || !loadedChatKeys.has(key) || !chatStateCache.has(key)) return;\n    void settleStateFileWrite(key, { flush: true }).catch(error => console.debug('[NPC State] page-hide flush deferred', error));\n}\n\nfunction cleanMessage");
          const d="    startInlineWatchdog();\n    scheduleSettingsMountRetries();";
          if(!s.includes(d)) throw new Error('lifecycle flush anchor missing');
          s=s.replace(d,"    startInlineWatchdog();\n    globalThis.addEventListener?.('pagehide', flushCurrentChatOnPageHide);\n    globalThis.document?.addEventListener?.('visibilitychange', () => { if (globalThis.document?.visibilityState === 'hidden') flushCurrentChatOnPageHide(); });\n    scheduleSettingsMountRetries();");
          fs.writeFileSync('index.js',s);
          NODE
      - name: Syntax and static hard pass
        run: |
          node --check index.js
          grep -q "currentPrefix" index.js
          grep -q "pagehide" index.js
          grep -q "Refusing to overwrite unhydrated" index.js
      - name: Remove temporary artifacts
        run: rm -rf .github tools/.pass2-trigger
      - name: Full repository suite
        run: npm test
      - name: Commit second-pass result
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A; git commit -m "Close rename namespace and page-hide durability gaps [pass2-verified]"; git push origin HEAD:v0.2.13-runtime-hardening
