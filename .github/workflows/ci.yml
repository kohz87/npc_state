name: NPC State CI

on:
  push:
    branches: [main, v0.2.15-release-hardening-10x]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply staged v0.2.16 release metadata
        if: ${{ github.ref == 'refs/heads/v0.2.15-release-hardening-10x' }}
        run: python3 .github/scripts/apply_v0215_release.py
      - name: Syntax and diff check
        run: |
          node --check index.js
          node --check core.js
          node --check branch.js
          node --check bundle.js
          node --check social.js
          node --check storage.js
          git diff --check
      - name: Ten hard-pass cycles
        run: |
          for pass in $(seq 1 10); do
            echo "========== HARD PASS ${pass}/10 =========="
            npm test
            node tests/compatibility-check.js
            node --check index.js
            node --check core.js
            node --check branch.js
            node --check bundle.js
            node --check social.js
            node --check storage.js
            git diff --check
          done
      - name: Ownership adversarial invariants
        if: ${{ github.ref == 'refs/heads/v0.2.15-release-hardening-10x' }}
        run: |
          grep -Fq "function ownershipEpoch" index.js
          grep -Fq "assertOwnershipEpoch(key, epoch);" index.js
          grep -Fq "sidecarTombstones" index.js
          grep -Fq "eventData.groupId" index.js
          grep -Fq "groupChatId" index.js
          grep -Fq "detachBrokenSidecar" index.js
          grep -Fq "likelyAncestorKeys" index.js
          test "$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version")" = "0.2.16"
      - name: Release consistency
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const core = fs.readFileSync('core.js', 'utf8');
          const readme = fs.readFileSync('README.md', 'utf8');
          const escaped = String(manifest.version).replaceAll('.', '\\.');
          if (!new RegExp(`NPC_STATE_VERSION = ['\"]${escaped}['\"]`).test(core)) throw new Error('core version does not match manifest');
          if (!readme.startsWith(`# NPC State v${manifest.version}`)) throw new Error('README version does not match manifest');
          NODE
      - name: Commit verified v0.2.16 release
        if: ${{ github.ref == 'refs/heads/v0.2.15-release-hardening-10x' }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No release changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js core.js manifest.json README.md CHANGELOG.md CODE-REVIEW.md TEST-REPORT.md tests/package.test.js tests/v0214-hardening.test.js
          git commit -m "release: verify v0.2.16 lifecycle hardening"
          git push origin HEAD:v0.2.15-release-hardening-10x
