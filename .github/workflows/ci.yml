name: NPC State v0.2.20 Candidate Gate

on:
  push:
    branches: [fix/v0.2.20-hard-pass]

permissions:
  contents: write

jobs:
  verify-and-promote-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate tooling branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply candidate patch
        run: |
          sed -i "/branch = replaceRange(branch, 'export function bestAncestorState', '', '', 'unused');/d" tests/apply-v0220-patch.mjs
          sed -i 's#            const p = `/files/${body.name}`;#            const p = "/files/" + body.name;#' tests/apply-v0220-patch.mjs
          node --check tests/apply-v0220-patch.mjs
          node tests/apply-v0220-patch.mjs
          sed -i "s/globalThis.NPCState?.version, '0.2.18'/globalThis.NPCState?.version, '0.2.20'/" tests/runtime-smoke.mjs
          python3 - <<'PY'
          from pathlib import Path

          def rewrite(path, old, new):
              p = Path(path)
              source = p.read_text()
              if old not in source:
                  raise RuntimeError(f'missing test patch anchor in {path}')
              p.write_text(source.replace(old, new, 1))

          rewrite('tests/index-hardening.test.js', """test('chat deletion handlers preserve chat/group namespace isolation',()=>{
            assert.match(source,/removeDeletedChatState\(chatId, 'chat', getCharacterOwnerId\(getContext\(\)\)\)/);
            assert.match(source,/removeDeletedChatState\(chatId, 'group', String\(getContext\(\)\.groupId \|\| ''\)\)/);
            assert.doesNotMatch(source,/for \(const key of \[`chat:\$\{id\}`, `group:\$\{id\}`\]\)/);
          });""", """test('filename-only chat deletion fails closed instead of borrowing an unrelated active owner',()=>{
            assert.match(source,/removeDeletedChatState\(chatId, 'chat', ''\)/);
            assert.match(source,/removeDeletedChatState\(chatId, 'group', ''\)/);
            assert.doesNotMatch(source,/removeDeletedChatState\(chatId, 'chat', getCharacterOwnerId\(getContext\(\)\)\)/);
            assert.doesNotMatch(source,/for \(const key of \[`chat:\$\{id\}`, `group:\$\{id\}`\]\)/);
          });""")

          rewrite('tests/index-hardening.test.js', """test('manual trash removes narrative name suppression and branch inheritance requires user-authored provenance',()=>{
            assert.match(source,/const permanentLabels = new Set/);
            assert.match(source,/working\.dismissed = .*?working\.dismissed/s);
            assert.match(source,/chat\.length < 4/);
            assert.match(source,/chat\.filter\(message => message\?\.is_user\)\.length < 2/);
          });""", """test('manual trash removes narrative name suppression while explicit host provenance can bypass generic branch heuristics',()=>{
            assert.match(source,/const permanentLabels = new Set/);
            assert.match(source,/working\.dismissed = .*?working\.dismissed/s);
            assert.match(source,/const mainChat = String\(metadata\?\.main_chat/);
            assert.match(source,/if \(!hasExplicitParent && \(chat\.length < 4 \|\| userTurns < 2\)\) return false/);
          });""")

          rewrite('tests/v0214-hardening.test.js', """    const switchPointer = fn.indexOf('settings.dataFiles[newKey] = newPointer');
              assert.ok(write >= 0 && verify > write && switchPointer > verify);
              assert.match(fn, /original mapping was preserved/);
              assert.match(fn, /makeNpcStateDataFileName\(newKey\)/);""", """    const retire = fn.indexOf('retireNpcStateDataFile');
              const switchPointer = fn.indexOf('settings.dataFiles[newKey] = newPointer');
              assert.ok(write >= 0 && verify > write && retire > verify && switchPointer > retire);
              assert.match(fn, /original durable ownership remains recoverable/);
              assert.match(fn, /makeNpcStateDataFileName\(newKey\)/);""")

          rewrite('tests/v0215-identity-hardening.test.js', """    assert.match(index, /bumpOwnershipEpoch\(key\);[\s\S]*scanOperations\.cancel\(key, 'chat-deleted'\)/);""", """    const lifecycleCache = index.slice(index.indexOf('function clearLifecycleCacheKey'), index.indexOf('async function loadLatestLifecycleState'));
              assert.match(lifecycleCache, /bumpOwnershipEpoch\(key\)/);
              assert.match(lifecycleCache, /scanOperations\.cancel\(key, reason\)/);
              assert.match(index, /clearLifecycleCacheKey\(key, 'chat-deleted'\)/);""")
          PY
      - name: Syntax and diff check
        run: |
          node --check bootstrap.js
          node --check hardening.js
          node --check hardening-core.js
          node --check index.js
          node --check core.js
          node --check core-v0218.js
          node --check branch.js
          node --check branch-v0218.js
          node --check bundle.js
          node --check social.js
          node --check storage.js
          node --check identity.js
          node --check tests/hardening-v0219.test.js
          node --check tests/hardening-v0220.test.js
          node --check tests/index-hardening.test.js
          node --check tests/v0214-hardening.test.js
          node --check tests/v0215-identity-hardening.test.js
          node --check tests/runtime-smoke.mjs
          git diff --check
      - name: Full verification
        run: npm test
      - name: Release consistency
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const core = fs.readFileSync('core.js', 'utf8');
          const readme = fs.readFileSync('README.md', 'utf8');
          if (manifest.version !== '0.2.20') throw new Error('candidate version mismatch');
          if (!core.includes("NPC_STATE_VERSION = '0.2.20'")) throw new Error('core version mismatch');
          if (!readme.startsWith('# NPC State v0.2.20')) throw new Error('README version mismatch');
          NODE
      - name: Commit exact verified candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No candidate changes to commit."
            exit 0
          fi
          git commit -m "release: v0.2.20 lifecycle cache and branch hardening"
          git push origin HEAD:fix/v0.2.20-hard-pass
