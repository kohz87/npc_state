name: Sync version metadata
on:
  push:
    branches: [main]
    paths: [.github/workflows/sync-version.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync v0.2.13 metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('README.md')
          s = p.read_text()
          s = s.replace('# NPC State v0.2.12', '# NPC State v0.2.13', 1)
          p.write_text(s)

          p = Path('CHANGELOG.md')
          s = p.read_text()
          marker = '## v0.2.12\n'
          if '## v0.2.13\n' not in s:
              section = '''## v0.2.13\n\n### Runtime lifecycle hardening\n\n- Gated dossier rendering and RP prompt injection on per-chat hydration readiness so unloaded state cannot briefly render or inject as authoritative empty state.\n- Coalesced automatic scans that arrive while a scan is already active, preventing valid assistant turns from being silently dropped.\n- Replaced branch-rescan polling retries with one pending scan per chat and deterministic drain after the active scan completes.\n- Hardened rapid chat switching by rejecting stale asynchronous hydration and branch work after the active chat changes.\n- Cleaned pending scan and hydration error state during chat deletion and preserved chat/group namespace isolation.\n- Added regression coverage for hydration gating, busy automatic scan coalescing, and chat-affine async completion.\n- Full hardening verification completed with 320/320 Node tests passing twice, plus syntax, SillyTavern 1.18 compatibility, runtime smoke, migration smoke, and package-layout checks.\n\n'''
              s = s.replace(marker, section + marker, 1)
          p.write_text(s)

          p = Path('CODE-REVIEW.md')
          s = p.read_text()
          s = s.replace('# NPC State v0.2.12 Code Review', '# NPC State v0.2.13 Code Review', 1)
          if '## v0.2.13 runtime lifecycle hardening' not in s:
              insert = '''\n\n## v0.2.13 runtime lifecycle hardening\n\n**High: rendering/injection could race chat hydration.** Dossier surfaces and RP injection are now gated until the active chat state is fully hydrated, preventing transient unloaded state from becoming visible or model-facing state.\n\n**High: automatic scans could be lost while another scan was active.** Busy automatic work now coalesces per chat and drains after the active scan finishes instead of being silently discarded.\n\n**Medium: branch rescans used bounded polling retries.** The retry loop was replaced with deterministic pending-work coalescing, removing timer churn while preserving the newest valid assistant turn.\n\n**High: rapid chat switching could allow stale async completion.** Chat-change hydration and branch reconciliation now re-check active chat identity after awaits and reject stale completion.\n\n**Verification:** two complete hard passes each finished at 320/320 tests, with zero failures, plus syntax, SillyTavern 1.18 compatibility, runtime smoke, migration smoke, and one-level package-layout checks.\n'''
              first = s.find('\n\n')
              s = s[:first] + insert + s[first:]
          p.write_text(s)

          p = Path('TEST-REPORT.md')
          s = p.read_text()
          s = s.replace('# NPC State v0.2.12 Test Report', '# NPC State v0.2.13 Test Report', 1)
          s = s.replace('**290/290 Node tests passed**', '**320/320 Node tests passed**', 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md CODE-REVIEW.md TEST-REPORT.md
          git commit -m "Sync v0.2.13 repository metadata"
          git push origin HEAD:main
