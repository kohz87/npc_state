name: Deep hardening pass
on:
  push:
    branches: [v0.2.13-deep-hardening-pass]
permissions:
  contents: write
jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[deep-pass-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply audited runtime fixes
        run: python3 .github/deep_harden.py
      - name: Hard pass 1
        run: npm test
      - name: Syntax checks
        run: node --check index.js && node --check core.js && node --check branch.js && node --check bundle.js && node --check storage.js
      - name: Hard pass 2
        run: npm test
      - name: Commit verified fixes
        run: |
          rm -f .github/deep_harden.py .github/workflows/deep-hardening-pass.yml .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deep harden v0.2.13 runtime lifecycle [deep-pass-applied]"
          git push origin HEAD:v0.2.13-deep-hardening-pass
